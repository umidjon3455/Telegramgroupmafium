name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install Django dependencies
        run: python -m pip install -r web/requirements.txt

      - name: Run Django checks and migrations
        working-directory: web
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_DEBUG: "True"
          TELEGRAM_SYNC_KEY: ci-only-sync-key
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate
          python manage.py test

  bot-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile bot modules
        run: python -m compileall -q bot
